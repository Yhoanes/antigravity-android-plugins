<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140c1c"/>
      <stop offset="55%" stop-color="#1d1124"/>
      <stop offset="100%" stop-color="#0b0710"/>
    </linearGradient>
    <linearGradient id="fireGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff3366"/>
      <stop offset="55%" stop-color="#ff6b35"/>
      <stop offset="100%" stop-color="#ffd166"/>
    </linearGradient>
    <linearGradient id="cyanPop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5d4"/>
      <stop offset="100%" stop-color="#00bbf9"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feComposite in="SourceGraphic" in2="b" operator="over"/>
    </filter>
  </defs>

  <!-- Outer Rounded Tile -->
  <rect x="36" y="36" width="440" height="440" rx="96" fill="url(#bgDark)" stroke="#3d2247" stroke-width="6"/>
  <rect x="52" y="52" width="408" height="408" rx="82" fill="none" stroke="url(#fireGrad)" stroke-opacity="0.32" stroke-width="2.5"/>

  <!-- 9:16 Vertical Phone/Clip Frame -->
  <rect x="164" y="76" width="184" height="304" rx="28" fill="#120b18" stroke="url(#fireGrad)" stroke-width="5"/>

  <!-- LIVE Badge Inside 9:16 Frame -->
  <rect x="184" y="96" width="76" height="28" rx="14" fill="#ff2a55"/>
  <circle cx="201" cy="110" r="5.5" fill="#ffffff"/>
  <text x="232" y="115" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="900" fill="#ffffff">LIVE</text>

  <!-- Face-Track Target Corners -->
  <g stroke="url(#cyanPop)" stroke-width="3.5" fill="none" stroke-linecap="round">
    <path d="M222 146 L210 146 L210 158"/>
    <path d="M290 146 L302 146 L302 158"/>
    <path d="M222 214 L210 214 L210 202"/>
    <path d="M290 214 L302 214 L302 202"/>
  </g>
  <circle cx="256" cy="174" r="14" fill="url(#cyanPop)" opacity="0.85"/>
  <path d="M234 206 C234 192 278 192 278 206" fill="url(#cyanPop)" opacity="0.85"/>

  <!-- Audio Peak Waveform Across Frame -->
  <g filter="url(#neonGlow)" stroke="url(#fireGrad)" stroke-width="7" stroke-linecap="round" fill="none">
    <line x1="96" y1="256" x2="96" y2="274"/>
    <line x1="120" y1="244" x2="120" y2="286"/>
    <line x1="144" y1="228" x2="144" y2="302"/>
    <line x1="196" y1="246" x2="196" y2="284"/>
    <line x1="226" y1="224" x2="226" y2="306"/>
    <line x1="256" y1="198" x2="256" y2="328"/>
    <line x1="286" y1="222" x2="286" y2="304"/>
    <line x1="316" y1="244" x2="316" y2="286"/>
    <line x1="368" y1="228" x2="368" y2="302"/>
    <line x1="392" y1="244" x2="392" y2="286"/>
    <line x1="416" y1="256" x2="416" y2="274"/>
  </g>

  <!-- Karaoke Caption Pill inside 9:16 -->
  <rect x="184" y="334" width="144" height="28" rx="8" fill="#ffffff"/>
  <text x="256" y="353" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="900" fill="#140c1c">9:16 • HYPE</text>

  <!-- Bottom Brand Pill -->
  <rect x="122" y="400" width="268" height="42" rx="21" fill="url(#fireGrad)"/>
  <text x="256" y="427" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="900" letter-spacing="1.4" fill="#120816">PEAKCUT PRO</text>
</svg>
